# ПОЛНЫЙ ФАЙНТЮН QWEN IMAGE 2512 20B
# === Модели ===
# DiT (трансформер), который обучаем
dit = "/workspace/musubi-tuner/models/qwen_image_2512_bf16.safetensors"
# путь к чекпоинту для продолжения обучения
# resume = "/workspace/musubi-tuner/<name_folder>/output/<name_folder_state>"
# VAE (кодирует/декодирует картинки в латенты)
vae = "/workspace/musubi-tuner/models/qwen_image_vae.safetensors"
# Qwen2.5-VL, кодирует подписи
text_encoder = "/workspace/musubi-tuner/models/qwen_2.5_vl_7b.safetensors"
# версия архитектуры: original = базовая Qwen-Image (text-to-image)
model_version = "original"

# === Датасеты ===
# обучающий датасет
dataset_config = "dataset.toml"
# валидационный датасет (отложенный, для loss/validation)
validation_dataset_config = "val_dataset.toml"
# считать validation loss каждые N шагов
validation_every_n_steps = 10
# фиксированный seed валидации, чтобы кривые были сравнимы между шагами
validation_seed = 1000

# === Точность и attention ===
# бэкенд внимания: встроенный PyTorch SDPA (просто и совместимо)
sdpa = true
# смешанная точность bf16 (рекомендуется для Qwen-Image)
mixed_precision = "bf16"
# веса в bf16 (обязательно для 20B: иначе fp32-веса+градиенты не влезают в 141 ГБ)
full_bf16 = true
# экономия VRAM ценой небольшого замедления (пересчёт активаций)
gradient_checkpointing = true

# === Сэмплирование timestep (flow matching) ===
# По умолчанию sigma + shift 1.0 -> рассогласование с инференсом Qwen-Image (он использует shift ~2.2 для 1024).
# метод сэмплирования шагов; shift = сдвинутое распределение (как рекомендуют доки)
timestep_sampling = "shift"
# величина сдвига; для Qwen-Image ~2.2 (согласовано с инференсом)
discrete_flow_shift = 2.2
# без доп. взвешивания лосса по timestep (как в примере обучения Qwen-Image)
weighting_scheme = "none"

# === Оптимизатор и learning rate ===
optimizer_type = "adafactor"
# relative_step  — вычислять ли LR автоматически из номера шага, игнорируя learning_rate
# scale_parameter — домножать ли LR на RMS(среднеквадратичное значение самого параметра), чтобы шаг был соразмерен масштабу весов
# warmup_init    — делать ли собственный разогрев LR внутри оптимизатора (работает только при relative_step)
# Все эти звучат хорошо, но по итогу лучше не трогать
optimizer_args = ["relative_step=False", "scale_parameter=False", "warmup_init=False"]

# шаг оптимизатора прямо в backward по каждому параметру -> убирает OOM
fused_backward_pass = true
# скорость обучения
learning_rate = 1e-5
# с fused_backward_pass клиппинг идёт по-параметрно (не глобально), но гасит выбросы
max_grad_norm = 0
# плавный разгон LR, затем постоянное значение
lr_scheduler = "constant_with_warmup"
# число шагов разогрева LR
lr_warmup_steps = 300

# === Загрузчик данных ===
# число воркеров чтения данных
max_data_loader_n_workers = 2
# не убивать воркеров между эпохами (убирает паузу)
persistent_data_loader_workers = true

# === Накопление градиентов ===
# держать 1: при fused_backward_pass оптимизатор шагает каждый micro-batch, накопление не работает
gradient_accumulation_steps = 1

# === DDP (мультиGPU) ===
# фиксирует граф: позволяет DDP работать с неиспользуемыми параметрами
ddp_static_graph = true
# экономия памяти на буферах градиентов DDP
ddp_gradient_as_bucket_view = true

# === Длительность и сохранения ===
# сколько всего шагов обучать
max_train_steps = 7200
# сохранять чекпоинт каждые N шагов
save_every_n_steps = 300
# хранить чекпоинты только за последние N шагов (старые удаляются)
save_last_n_steps = 300
# сохранять или нет состояние оптимизатора (экономия диска; продолжение через --dit с разогревом)
save_state = true
# отдельный .safetensors рядом со state (qwen2512-ft-stepXXXXXXXX.safetensors). false — не дублировать веса, resume через --resume
save_weights = false
# seed обучения (воспроизводимость)
seed = 1000

# === Вывод ===
# куда сохранять чекпоинты
output_dir = "/workspace/musubi-tuner/<name_folder>/output"
# базовое имя файлов модели
output_name = "qwen2512-ft"

# === Логи (TensorBoard) ===
# папка логов
logging_dir = "/workspace/musubi-tuner/<name_folder>/logs"
# бэкенд логирования
log_with = "tensorboard"
# префикс имени запуска
log_prefix = "qwen2512-ft"

# === Сэмплы во время обучения ===
# промпты для генерации сэмплов
sample_prompts = "/workspace/musubi-tuner/<name_folder>/sample_prompts.txt"
# генерировать сэмплы каждые N шагов
sample_every_n_steps = 300
# сгенерировать сэмплы на шаге 0 (базовая точка до обучения)
sample_at_first = false
